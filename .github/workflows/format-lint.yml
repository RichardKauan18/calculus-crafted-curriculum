name: Format and verify lint

on:
  push:
    branches:
      - fix-lint-prettier-2026-10-09
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Apply repository Prettier formatting
        run: bunx prettier --write .
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Apply Prettier formatting across repository"
          git push origin HEAD:${{ github.ref_name }}
      - name: Verify lint
        run: bun run lint
      - name: Verify build
        run: bun run build
      - name: Verify tests
        run: bun run test
