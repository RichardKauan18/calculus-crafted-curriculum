name: Validate Matris fusion

on:
  push:
    branches: ["fusion/matematicando-best-of"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build
      - id: lint
        run: bun run lint
      # Run tests even when lint fails so both quality signals remain visible.
      - if: success() || steps.lint.outcome == 'failure'
        run: bun run test
