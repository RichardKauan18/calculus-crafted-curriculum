name: Frontend quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Apply Prettier formatting to changed files
        run: npx prettier --write src/components/platform.tsx src/hooks/useAuth.tsx src/hooks/usePlatformData.ts src/lib/supabase.ts
      - name: Commit formatting fixes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/platform.tsx src/hooks/useAuth.tsx src/hooks/usePlatformData.ts src/lib/supabase.ts
            git commit -m "style: format frontend files [skip ci]"
            git push
          fi
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm run test -- --passWithNoTests
